[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bild-python"
version = "0.1.0"
description = "Python SDK for the Bild External API"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AJ + Gilbert" }]
license = { text = "MIT" }
dependencies = ["requests>=2.31.0"]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/AJFrio/Bild-Python"
Documentation = "https://bildexternalapi.portledocs.com/"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["bild*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["bild", "tests", "tools"]
exclude = ["bild_python.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["bild"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
