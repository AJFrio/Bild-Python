repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: harness
        name: harness linters
        entry: python tools/check.py
        language: system
        pass_filenames: false
